name: Device output formats

# Captures real AppOps output from emulators and runs it through the parsers,
# so a platform format change shows up here before users report it. Emulators
# are slow, so this runs weekly and on demand rather than on every push. A pull
# request runs it only when it changes the capture tooling itself.
on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/device-formats.yml"
      - "scripts/capture-device-dumps.sh"
      - "app/src/test/java/dev/izumi/appopsnext/appops/parser/DeviceDumpCompatibilityTest.kt"

permissions:
  contents: read

concurrency:
  group: device-formats-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    name: API ${{ matrix.api-level }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # 36.1 is Android 16 QPR2, the first build without the `Current `
        # header prefix (issue #13). 37.0 is the newest google_apis x86_64
        # image; later 37.x builds ship only as 16 KB page-size images.
        api-level: ["35", "36", "36.1", "37.0"]
    env:
      APPOPSNEXT_DEVICE_DUMPS: ${{ github.workspace }}/build/device-dumps/api-${{ matrix.api-level }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.5"
          cache: false

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # Compiling before the emulator starts keeps the two from competing for
      # the runner's memory.
      - name: Compile unit tests
        run: ./gradlew :app:compileDebugUnitTestKotlin --no-daemon

      - name: Capture dumps
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          # With the action's defaults (2 cores, no RAM or disk size), the
          # 36.1 and 37.0 images never got past `adb: device offline` within
          # ten minutes. API 36 raises its own RAM to 2560 MB and booted in
          # seconds. The runner has 4 cores and 16 GB.
          profile: pixel_6
          cores: 4
          ram-size: 4096M
          heap-size: 512M
          disk-size: 8G
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: scripts/capture-device-dumps.sh "$APPOPSNEXT_DEVICE_DUMPS"

      - name: Parse dumps
        run: |
          ./gradlew :app:testDebugUnitTest \
            --tests dev.izumi.appopsnext.appops.parser.DeviceDumpCompatibilityTest \
            --no-daemon

      - name: Upload dumps
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: device-dumps-api-${{ matrix.api-level }}-${{ github.run_number }}
          path: |
            ${{ env.APPOPSNEXT_DEVICE_DUMPS }}
            app/build/reports/tests/testDebugUnitTest
          if-no-files-found: warn
          retention-days: 14
