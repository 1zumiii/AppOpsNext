name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, sign, and draft the release
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Verify the tag matches the app version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(
            grep -oE 'versionName = "[^"]+"' app/build.gradle.kts \
              | head -1 \
              | sed -E 's/.*"([^"]+)".*/\1/'
          )"
          echo "tag=$tag versionName=$version"
          test "$tag" = "$version"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.5"
          cache: false

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Restore release signing identity
        env:
          RELEASE_KEYSTORE_BASE64: >-
            ${{ secrets.APPOPSNEXT_RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$RELEASE_KEYSTORE_BASE64"
          install -d -m 700 .signing
          printf '%s' "$RELEASE_KEYSTORE_BASE64" \
            | base64 --decode \
            > .signing/appopsnext-release.keystore
          chmod 600 .signing/appopsnext-release.keystore

      - name: Test native daemon
        working-directory: daemon
        run: go test ./...

      - name: Test, lint, and build signed APK
        env:
          APPOPSNEXT_STORE_PASSWORD: >-
            ${{ secrets.APPOPSNEXT_RELEASE_PASSWORD }}
          APPOPSNEXT_KEY_PASSWORD: >-
            ${{ secrets.APPOPSNEXT_RELEASE_PASSWORD }}
        run: |
          test -n "$APPOPSNEXT_STORE_PASSWORD"
          ./gradlew \
            :app:testDebugUnitTest \
            :app:lintDebug \
            :app:assembleRelease \
            --no-daemon

      - name: Verify the APK signature
        run: |
          apksigner="$(
            ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1
          )"
          "$apksigner" verify \
            --verbose \
            --print-certs \
            app/build/outputs/apk/release/app-release.apk

      - name: Prepare artifacts
        id: artifacts
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/release/app-release.apk artifacts/
          cd artifacts
          sha256sum app-release.apk > app-release.apk.sha256
          echo "checksum=$(cut -d' ' -f1 app-release.apk.sha256)" \
            >> "$GITHUB_OUTPUT"

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHECKSUM: ${{ steps.artifacts.outputs.checksum }}
        run: |
          # A tag carrying a suffix such as v1.4.1-beta1 is published as a
          # prerelease, which keeps it out of "latest" and therefore out of the
          # update check and the download link in the README.
          case "$GITHUB_REF_NAME" in
            *-*) prerelease="--prerelease" ;;
            *) prerelease="" ;;
          esac
          echo "ref=$GITHUB_REF_NAME prerelease=${prerelease:-no}"
          gh release create "$GITHUB_REF_NAME" \
            --draft \
            $prerelease \
            --title "$GITHUB_REF_NAME" \
            --notes "SHA-256 (app-release.apk): \`$CHECKSUM\`" \
            artifacts/app-release.apk \
            artifacts/app-release.apk.sha256
